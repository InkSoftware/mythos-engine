name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} (portable ${{ matrix.portable }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-2022]
        portable: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev wayland-protocols \
            libdecor-0-dev

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS' && matrix.portable == 'OFF'
        run: brew install sdl3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMYTHOS_BUILD_TESTS=ON -DMYTHOS_PORTABLE=${{ matrix.portable }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
