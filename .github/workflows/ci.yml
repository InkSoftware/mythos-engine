name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting and static analysis; any difference or warning fails the job.
  lint:
    name: clang-format and clang-tidy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM
        run: brew install llvm@23

      - name: Configure (compile database)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMYTHOS_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-format
        run: |
          export PATH="$(brew --prefix llvm@23)/bin:$PATH"
          git ls-files '*.cpp' '*.h' ':!:third_party/**' | xargs clang-format --style=file --dry-run --Werror

      - name: clang-tidy
        run: |
          export PATH="$(brew --prefix llvm@23)/bin:$PATH"
          git ls-files 'src/*.cpp' 'tools/*.cpp' 'tests/*.cpp' ':!:third_party/**' \
            | xargs clang-tidy --quiet -p build --warnings-as-errors='*'

  build-test:
    name: ${{ matrix.os }} (portable ${{ matrix.portable }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The portable builds (SDL linked statically) are what ships, on every OS. One non-portable build, on Linux,
      # keeps the system-SDL path covered; it is the same code on every OS.
      matrix:
        include:
          - { os: ubuntu-22.04, portable: "ON" }
          - { os: macos-15, portable: "ON" }
          - { os: windows-2022, portable: "ON" }
          - { os: ubuntu-22.04, portable: "OFF" }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev wayland-protocols \
            libdecor-0-dev

      # Build cache (Linux): ccache keeps the compiled objects between runs, mostly the static SDL3 build.
      # Not used on macOS (the universal build compiles for two architectures, which ccache cannot cache) or
      # on Windows (MSVC needs embedded debug info for ccache).
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ccache

      - name: Restore the ccache folder (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ matrix.portable }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.portable }}-

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS' && matrix.portable == 'OFF'
        run: brew install sdl3

      # macOS: the portable build is universal (arm64 + x86_64), built on the oldest supported macOS, since a
      # deployment target of 15 also runs on newer releases. The non-portable build uses Homebrew's SDL, which
      # is arm64 only, so it stays native.
      - name: Configure
        run: |
          ARCHS=""
          if [ "$RUNNER_OS" = "macOS" ] && [ "${{ matrix.portable }}" = "ON" ]; then ARCHS="arm64;x86_64"; fi
          LAUNCHER=""
          if [ "$RUNNER_OS" = "Linux" ]; then LAUNCHER="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMYTHOS_BUILD_TESTS=ON -DMYTHOS_WARNINGS_AS_ERRORS=ON $LAUNCHER \
            -DMYTHOS_PORTABLE=${{ matrix.portable }} ${ARCHS:+-DCMAKE_OSX_ARCHITECTURES="$ARCHS"}
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Test the x86_64 slice under Rosetta (macOS, portable)
        if: runner.os == 'macOS' && matrix.portable == 'ON'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 ./build/mythos_engine_tests
